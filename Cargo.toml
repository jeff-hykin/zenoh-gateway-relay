[package]
name = "zenoh-gateway-relay"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Fan one zenoh-gateway backend out to many browsers: the backend dials out over zenoh, sends each camera once at best quality, and the relay re-encodes per viewer"
repository = "https://github.com/jeff-hykin/zenoh-gateway-relay"
license-file = "LICENSE"
readme = "README.md"
keywords = ["zenoh", "webrtc", "relay", "robotics", "video"]
categories = ["network-programming", "multimedia::video", "science::robotics"]
# only what building the library and the command needs
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "zenoh-gateway-relay"
path = "src/main.rs"

[dependencies]
zenoh-gateway = { version = "0.5.0", features = ["client"] }
# the versions zenoh-gateway pins (1.7.0 through 1.10.1 deadlock answering the admin space)
zenoh = "=1.6.2"
zenoh-ext = { version = "=1.6.2", features = ["unstable"] }
# decodes the backend's H.264 once per camera (builds its C sources, like zenoh-gateway's encoder)
openh264 = "0.9"
# decodes the backend's Opus once per audio stream (libopus transpiled to Rust, as zenoh-gateway encodes it)
unsafe-libopus = "0.2"
# hardware re-encoding (zenoh_dimos_codecs::encoders): VideoToolbox, GStreamer (loaded at runtime), openh264 fallback
zenoh-dimos-codecs = { version = "0.3.0", features = ["videotoolbox", "gstreamer"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
axum = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
clap = { version = "4", features = ["derive"] }
