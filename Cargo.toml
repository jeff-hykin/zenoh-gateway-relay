[package]
name = "zenoh-web-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fan one zenoh-web backend out to many browsers: the backend dials out over zenoh, sends each camera once at best quality, and the relay re-encodes per viewer"
repository = "https://github.com/jeff-hykin/zenoh-web-relay"
license-file = "LICENSE"
readme = "README.md"
keywords = ["zenoh", "webrtc", "relay", "robotics", "video"]
categories = ["network-programming", "multimedia::video", "science::robotics"]
# only what building the library and the command needs
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "zenoh-web-relay"
path = "src/main.rs"

[dependencies]
zenoh-web = { version = "0.4.0", git = "https://github.com/jeff-hykin/zenoh-web", rev = "fb465e704544008095a00b5416d68b6abc91147c", features = ["client"] }
# the versions zenoh-web pins (1.7.0 through 1.10.1 deadlock answering the admin space)
zenoh = "=1.6.2"
zenoh-ext = { version = "=1.6.2", features = ["unstable"] }
# decodes the backend's H.264 once per camera (builds its C sources, like zenoh-web's encoder)
openh264 = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
axum = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
clap = { version = "4", features = ["derive"] }
